<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar empleado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary justify-content-between">
        <a class="navbar-brand" href="index.html">Recursos Humanos Taller de Node.js S.A</a>
       <button class="btn btn-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">Editar empleado</div>
            <div class="card-body">
                <div class="form-group">
                    <label for="idEmpleado">Ingresa el ID del empleado que deseas editar</label>
                    <input type="number" min="1" id="idEmpleado" class="form-control" placeholder="Escribe el ID del empleado">
                </div>
                <button type="button" class="btn btn-primary" onclick="buscarEmpleadoEditar()">Buscar empleado</button>
                <div id="empleadoEncontrado" class="mt-3"></div>
                <form id="formEditar" class="mt-3" style="display:none;" onsubmit="guardarEdicion(event)">
                    <p>Modifica los datos que necesites actualizar y guarda los cambios.</p>
                    <div class="form-group">
                        <label for="nuevo_nombre">Nombre</label>
                        <input type="text" class="form-control" id="nuevo_nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="nuevo_apellido">Apellido</label>
                        <input type="text" class="form-control" id="nuevo_apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="nuevo_telefono">Número telefónico</label>
                        <input type="tel" class="form-control" id="nuevo_telefono" required>
                    </div>
                    <div class="form-group">
                        <label for="nuevo_correo">Correo electrónico</label>
                        <input type="email" class="form-control" id="nuevo_correo" required>
                    </div>
                    <div class="form-group">
                        <label for="nuevo_direccion">Dirección</label>
                        <input type="text" class="form-control" id="nuevo_direccion" required>
                    </div>
                    <button type="submit" class="btn btn-warning">Guardar cambios</button>
                </form>
                <div id="mensaje" class="mt-3"></div>
                <a href="index.html" class="btn btn-secondary mt-3">Regresar al menú</a>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/empresa.js"></script>
</body>
</html>
