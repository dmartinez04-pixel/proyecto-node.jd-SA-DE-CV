<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar empleado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary justify-content-between">
        <a class="navbar-brand" href="index.html">Recursos Humanos Taller de Node.js S.A</a>
       <button class="btn btn-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">Eliminar empleado</div>
            <div class="card-body">
                <div class="form-group">
                    <label for="idEmpleadoEliminar">Ingresa el ID del empleado que deseas eliminar</label>
                    <input type="number" min="1" id="idEmpleadoEliminar" class="form-control" placeholder="ID del empleado">
                </div>
                <button type="button" class="btn btn-primary" onclick="mostrarSeleccionEliminar()">Buscar empleado</button>
                <div id="confirmacion" class="mt-3" style="display:none;">
                    <p id="empleadoAEliminar">¿Estás seguro de que deseas eliminar a este empleado?</p>
                    <button type="button" class="btn btn-danger" onclick="eliminarEmpleado()">Sí, eliminar definitivamente</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelarEliminar()">Cancelar</button>
                </div>
                <div id="mensaje" class="mt-3"></div>
                <a href="index.html" class="btn btn-secondary mt-3">Regresar al menú</a>
            </div>
        </div>
    </div>
   <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/empresa.js"></script>
</html>
