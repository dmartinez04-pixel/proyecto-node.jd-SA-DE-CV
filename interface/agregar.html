<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar nuevo empleado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary justify-content-between">
        <a class="navbar-brand" href="index.html">Recursos Humanos Taller de Node.js S.A</a>
        <button class="btn btn-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </nav>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">Agregar nuevo empleado</div>
            <div class="card-body">
                <form onsubmit="agregarEmpleado(event)">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellidos</label>
                        <input type="text" class="form-control" id="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Número telefónico</label>
                        <input type="tel" class="form-control" id="telefono" required>
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" class="form-control" id="direccion" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar empleado</button>
                    <a href="index.html" class="btn btn-secondary">Regresar</a>
                </form>
                <div id="mensaje" class="mt-3"></div>
            </div>
        </div>
    </div>
   <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="js/empresa.js"></script>
</html>
